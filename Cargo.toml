[workspace]
members = ["crates/core", "crates/cli", "crates/web", "crates/api"]
resolver = "2"

[workspace.package]
version = "0.2.4" # x-release-please-version
edition = "2021"
# 实测下限，不是声明：1.86 过不了（icu_* 2.4 要求 1.88），1.88.0 通过。
# CI 的 msrv job 会用这个版本真跑一次 --locked，别只改这里。
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/qiaopengjun5162/assay"
authors = ["Paxon Qiao <qiaopengjun0@gmail.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
# 注意：不能开 strip = true，wasm-bindgen 会读不到 target_features 段

[profile.profiling]
debug = "full"
inherits = "release"
strip = false
