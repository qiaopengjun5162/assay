name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` 给本机加了 `-C target-cpu=native`（macOS 上编得快）。
  # 但 GitHub runner 不保证「编译这台」和「运行这台」是同一代 CPU，rust-cache
  # 还会把 target/ 跨代缓存下来；一旦命中不同代际的 runner，产物会在运行时
  # SIGILL。2026-10-29 在 moonpub 上踩过：rustc 直接死掉。
  # 环境变量优先于 config，空串同样生效 —— CI 一律用默认目标 CPU。
  RUSTFLAGS: ""

jobs:
  rust:
    name: rust · fmt / clippy / test / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 安装 nextest / deny / taplo
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,taplo

      - name: Format（Rust）
        run: cargo fmt --all -- --check

      - name: Format（TOML）
        run: taplo fmt --check

      - name: Clippy（零容忍）
        run: cargo clippy -p assay-core -p assay -p assay-api --all-targets --all-features -- -D warnings

      - name: Test（nextest，含 web 复核命令纯函数）
        run: cargo nextest run -p assay-core -p assay -p assay-api -p assay-web --all-features

      - name: 依赖审计（许可证 + 漏洞）
        run: cargo deny check

      # RSI 外环：踩过的坑要变成门禁。
      # 「文档引用已删除路径」曾让 PLAN.md 在另一个 AI 接手时误导排错——
      # 见 docs/HISTORY.md 第八节。历史记录 DECISIONS.md 不参与检查。
      - name: 文档不得引用已删除路径
        run: |
          if grep -rnE 'scripts/(aggregate|scoring|proof_top|export_web|explain|evidence|guard|test_guard|log_step)\.py|rust-core/|check_proofs\.sh' README.md AGENTS.md docs/REQUIREMENTS.md docs/ARCHITECTURE.md docs/PLAN.md docs/HANDOFF.md; then
            echo "文档漂移：引用了不存在的路径"; exit 1
          fi

      - name: 证据复核（入库的 500 份，逐份重算 SHA-256）
        run: cargo run --release -q -p assay -- verify-evidence web/data.json web/evidence

      - name: Build release
        run: cargo build --release --locked -p assay

      # scripts/news-check.sh 是「公众号日报体检」的生产入口，但它不在 cargo test
      # 的覆盖里：audit → report → checks → 摘要 这条链断了，Rust 测试照样全绿。
      # 用固定 fixture 跑一遍，只断言「跑通 + 摘要出来了 + checks.txt 落盘」，
      # 不锁具体数字——口径调整（比如 DESC_MIN）不该让 CI 红。
      - name: 日报体检脚本冒烟（生产路径）
        run: |
          bash scripts/news-check.sh -o out-ci fixtures/qunmind-items.json > /tmp/news-check.log 2>&1 || {
            echo "news-check.sh 跑不通："; cat /tmp/news-check.log; exit 1
          }
          grep -q "公众号日报体检" /tmp/news-check.log
          test -s out-ci/checks.txt
          test -s out-ci/summary.json
          echo "冒烟通过：$(grep -c . /tmp/news-check.log) 行输出，产物齐全"

      # 门禁三档是 cron 唯一读的东西，判错一档就是「该拦没拦」或「天天误拦」。
      # 合成数据只写 summary.json + run.json（门禁只读这两个文件），不锁具体数字。
      - name: 发报门禁三档冒烟
        run: |
          set -e
          # fixture 4 条里 1 条超 90 天 = 25%，超过 20% 上限，必须拦（1）。
          # 条目下限临时降到 4，否则会先撞「条目太少」判成不可信，测不到拦截档。
          set +e
          GATE_MIN_ITEMS=4 bash scripts/news-gate.sh out-ci/summary.json > /tmp/gate-1.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q "GATE=BLOCK" /tmp/gate-1.log
          echo "拦截档 OK：$(grep '超 90 天条目' /tmp/gate-1.log)"

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc).isoformat()
          for name, s in {
              "ok":   {"audited": 100, "withPreview": 100, "schemaMismatch": 0, "lagOver90Days": 1, "noDescription": 41},
              "bad":  {"audited": 0, "withPreview": 0, "schemaMismatch": 0, "lagOver90Days": 0},
              "stale":{"audited": 100, "withPreview": 100, "schemaMismatch": 0, "lagOver90Days": 0},
          }.items():
              d = f"out-gate-{name}"
              os.makedirs(d, exist_ok=True)
              json.dump(s, open(f"{d}/summary.json", "w"))
              when = "2026-11-20T00:00:00+00:00" if name == "stale" else now
              json.dump({"capturedAt": when}, open(f"{d}/run.json", "w"))
          PY

          for pair in "ok:0:PASS" "bad:2:UNTRUSTED" "stale:2:UNTRUSTED"; do
            IFS=: read -r name want marker <<< "$pair"
            set +e
            bash scripts/news-gate.sh "out-gate-$name/summary.json" > "/tmp/gate-$name.log" 2>&1
            rc=$?
            set -e
            test "$rc" -eq "$want"
            grep -q "GATE=$marker" "/tmp/gate-$name.log"
            echo "$name 档 OK：GATE=$marker（exit $rc）"
          done

          # 除零边角：把条目下限覆盖成 0 时，0 条也不能让 python 崩。
          # 崩了会退出 1 且没有 GATE= 行，cron 误判成 BLOCK（该拦）而不是 UNTRUSTED（跑批坏了）。
          set +e
          GATE_MIN_ITEMS=0 bash scripts/news-gate.sh out-gate-bad/summary.json > /tmp/gate-zero.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q "GATE=UNTRUSTED" /tmp/gate-zero.log
          ! grep -q "Traceback" /tmp/gate-zero.log
          echo "除零边角 OK：GATE=UNTRUSTED（exit $rc），无 traceback"

  # README 曾写「Rust 1.85+」，但没人验证过。实测：1.86 直接过不了
  # （icu_* 2.4 要求 1.88），1.88.0 通过。`rust-version` 写进 Cargo.toml
  # 只表示「我声明」，不表示「CI 在测」——声明不测等于没声明。
  # `--locked` 是关键：查的是我们真正发布的那套依赖，而不是让老工具链
  # 自己解析出另一套更旧的。
  msrv:
    name: msrv · 1.88 真编一次
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: 最低支持版本检查
        run: cargo check --locked -p assay-core -p assay -p assay-api --all-features

  # 地板存在的意义：让「能自动验证的那部分」不会悄悄烂掉。
  # 一次测量出两个数、两个地板：逻辑主体（core+cli）76.88% → 74，
  # 全量（含 api）73.81% → 72。为什么分两个，见 scripts/coverage.sh 头部。
  # macOS 与 Ubuntu 实测一致，这里没有 cfg 差异要担心。
  # 只升不降：新代码没测试就该让这里红。
  coverage:
    name: coverage · 行覆盖率地板
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: 覆盖率地板
        run: |
          chmod +x scripts/coverage.sh
          ./scripts/coverage.sh

  wasm:
    name: wasm · Leptos 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # 用预编译包：cargo install trunk 在 CI 里要编译几分钟
      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz
          sudo mv trunk /usr/local/bin/
          trunk --version

      - name: Clippy（wasm 目标，零容忍）
        run: cargo clippy -p assay-web --target wasm32-unknown-unknown --all-features -- -D warnings

      - name: Build dist
        working-directory: crates/web
        run: trunk build --release

      # RSI 外环：trunk 默认生成绝对路径，项目站点在 /<repo>/ 子路径下
      # 会 404 导致页面空白——本地根路径复现不了，只有 CI 能拦。
      - name: 资产必须是相对路径
        working-directory: crates/web/dist
        run: |
          if grep -oE '(href|src)="(/[^/])' index.html; then
            echo "发现绝对路径引用，子路径部署会 404"; exit 1
          fi
          echo "资产均为相对路径"

      - name: 产物自检
        run: |
          test -f crates/web/dist/index.html
          test -f crates/web/dist/data.json
          test -f crates/web/dist/TopProofs.lean
          ls -lh crates/web/dist | head

  lean:
    name: lean · 证明内核校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 缓存 elan 工具链
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: 安装 elan（工具链由 lean-toolchain 指定）
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: 内核校验（拒绝 sorry / admit）
        run: cargo run --release -p assay -- check-proofs fixtures/expected.lean

      # 反过来的一半：改一位数字，内核必须拒绝。命令自身退出 0 表示演示成功，
      # 屏幕上打印的「lean 退出码 1」才是内核的判定——别把两者混为一谈。
      - name: 篡改演示（内核必须拒绝）
        run: cargo run --release -q -p assay -- tamper --file fixtures/expected.lean

      # 上面全是「正常产物能通过」。这道证明反过来的一半：故意改字节 / 删证据 /
      # 改报告哈希 / 塞 sorry，确认各门禁真的会红。check-proofs 也要 lean，
      # 所以整套自测放在本 job（rust job 没装 lean）。全在临时副本上做。
      - name: 门禁负向自测（坏产物必须被拒）
        run: bash scripts/gate-negative.sh

  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 不用 gitleaks-action：它按 push 事件算 bb83aac^..HEAD，而 bb83aac 是根提交，
      # 没有父提交 → "ambiguous argument" → 报 exit 1（明明没扫到任何东西）。
      # 直接调 CLI，扫全部分支历史。
      - name: 扫描历史
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact -v --exit-code=1 --log-opts="--all"

  # 本地 .githooks/commit-msg 能被 --no-verify 绕过，新人也可能忘了跑 just hooks。
  # 钩子图方便，CI 才有约束力。
  commit-lint:
    name: commits · Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验提交信息
        run: |
          chmod +x scripts/check-commits.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}"
          else
            ./scripts/check-commits.sh "${{ github.event.before }}"
          fi

  docs:
    name: docs · Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint
        run: |
          chmod +x scripts/lint-docs.sh
          # 版本钉死且与本地一致：本地 `just lint-docs` 用的是已安装的那版，
          # 之前 CI 钉 0.18.1、本地跑 0.23.2，两边规则集不同 —— 会出现
          # 「本地绿 CI 红」或更糟的「CI 绿本地红」。改版本两边一起改。
          npx --yes markdownlint-cli2@0.23.2

      # `just typos` 曾经一直是红的：它写在 Justfile 里，但 CI 不跑，本地也没人
      # 顺手跑——`flate2` 被拆成 "flate"、测试里 `ba` 变量被判成 "by"。门禁不进 CI，
      # 就等于没有门禁，只是给读 Justfile 的人一个错误的印象。
      - name: 拼写检查（typos）
        uses: crate-ci/typos@v1

      # core 与前端各有自己的阈值常量（web 不依赖 core，避免把 ureq 拉进 wasm）。
      # 数值漂移不会编译失败，只会让页面和报告给出互相打脸的数字，所以要单独比。
      - name: 阈值一致性（core ↔ 前端）
        run: bash scripts/check-thresholds.sh
