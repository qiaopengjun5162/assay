# git-cliff 配置：只从 Conventional Commits 里取可读部分
# 生成：git cliff -o CHANGELOG.md --latest
[changelog]
header = """
# Changelog\n
本项目所有值得记录的变更。格式参考 [Keep a Changelog](https://keepachangelog.com/)，
版本号遵循 [SemVer](https://semver.org/)。\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [未发布]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**：{% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = """
<!-- 由 git-cliff 生成，请勿手改 -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "新增" },
  { message = "^fix", group = "修复" },
  { message = "^doc", group = "文档" },
  { message = "^refactor", group = "重构" },
  { message = "^perf", group = "性能" },
  { message = "^test", group = "测试" },
  { message = "^chore|^ci", group = "杂务" },
  { body = ".*security", group = "安全" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
