<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1000" height="620" fill="#f5f4f1"/>

  <text x="40" y="46" font-size="22" font-weight="800" fill="#14161a">数验 Assay · 数据体检与可复核证明</text>
  <text x="40" y="70" font-size="13" fill="#4d5462">两条链都绕开模型：哈希钉住时点，定理钉住推导</text>

  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#3b4048"/>
    </marker>
  </defs>

  <!-- 1 数据源 -->
  <rect x="40" y="96" width="310" height="92" rx="10" fill="#fff" stroke="#b9c0cb"/>
  <text x="60" y="124" font-size="14" font-weight="700" fill="#14161a">浙江省公共数据开放平台</text>
  <text x="60" y="146" font-size="12" fill="#4d5462">24,322 个数据集 · 免登录接口</text>
  <text x="60" y="166" font-size="12" fill="#4d5462">目录 / 字段定义 / 5 行样例</text>

  <!-- 2 采集 -->
  <rect x="40" y="236" width="310" height="104" rx="10" fill="#fff" stroke="#b9c0cb"/>
  <text x="60" y="262" font-size="14" font-weight="700" fill="#14161a">Rust 采集（8 线程）</text>
  <text x="60" y="284" font-size="12" fill="#4d5462">全量 11.7 分钟 · 0 条失败</text>
  <text x="60" y="304" font-size="12" fill="#4d5462">断点续跑，逐条落 JSONL</text>
  <text x="60" y="324" font-size="12" fill="#4d5462">目录快照一并落盘</text>

  <!-- 3 规则 -->
  <rect x="390" y="236" width="270" height="104" rx="10" fill="#fff" stroke="#b9c0cb"/>
  <text x="410" y="262" font-size="14" font-weight="700" fill="#14161a">规则判定（确定性）</text>
  <text x="410" y="284" font-size="12" fill="#4d5462">GB/T 36344-2018 六维</text>
  <text x="410" y="304" font-size="12" fill="#4d5462">准确性：不评价</text>
  <text x="410" y="324" font-size="12" fill="#4d5462">字段一致性分三类</text>

  <!-- 4 证据 -->
  <rect x="700" y="196" width="230" height="82" rx="10" fill="#fff" stroke="#a8d5ba" stroke-width="2"/>
  <text x="718" y="220" font-size="13.5" font-weight="700" fill="#08492a">证据包 · 100 份</text>
  <text x="718" y="240" font-size="11.5" fill="#4d5462">原始响应 + SHA-256</text>
  <text x="718" y="258" font-size="11.5" fill="#4d5462">抓取时点 · 可下载</text>

  <!-- 5 证明 -->
  <rect x="700" y="296" width="230" height="82" rx="10" fill="#fff" stroke="#a8d5ba" stroke-width="2"/>
  <text x="718" y="320" font-size="13.5" font-weight="700" fill="#08492a">Lean 4 · 2,355 条定理</text>
  <text x="718" y="340" font-size="11.5" fill="#4d5462">内核逐条穷举校验</text>
  <text x="718" y="358" font-size="11.5" fill="#4d5462">改一位数字即报错</text>

  <!-- 6 前端 -->
  <rect x="40" y="440" width="890" height="98" rx="10" fill="#fff" stroke="#b9c0cb"/>
  <text x="60" y="466" font-size="14" font-weight="700" fill="#14161a">静态前端（无后端，断网可演示）</text>
  <text x="60" y="488" font-size="12" fill="#4d5462">榜单 500 条 · 详情六维 · 证据包 · 证明页 PASS</text>
  <text x="60" y="510" font-size="12" fill="#4d5462">web/data.json 662KB，纯静态部署</text>
  <text x="600" y="488" font-size="12" fill="#14161a">在线：qiaopengjun5162.github.io/assay</text>
  <text x="600" y="510" font-size="12" fill="#4d5462">本地：just serve → :8080</text>

  <!-- 7 底部边界 -->
  <rect x="40" y="562" width="890" height="46" rx="8" fill="#fdecea" stroke="#e9b3ad"/>
  <text x="60" y="582" font-size="12.5" font-weight="700" fill="#8f1d17">AI 的边界：只写人话，不参与取数。</text>
  <text x="60" y="600" font-size="11.5" fill="#8f1d17">实测 read_url 读该平台详情页返回 0 字节文档，模型仍"抄"出了不存在的「数据条数：382」。</text>

  <!-- 箭头 -->
  <line x1="195" y1="192" x2="195" y2="230" stroke="#3b4048" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="355" y1="288" x2="384" y2="288" stroke="#3b4048" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 665 280 L 682 280 L 682 237 L 694 237" fill="none" stroke="#3b4048" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 665 300 L 682 300 L 682 337 L 694 337" fill="none" stroke="#3b4048" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="815" y1="382" x2="815" y2="434" stroke="#3b4048" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 930 240 L 952 240 L 952 434" fill="none" stroke="#3b4048" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="195" y1="344" x2="195" y2="434" stroke="#3b4048" stroke-width="1.6" marker-end="url(#arw)"/>
</svg>
