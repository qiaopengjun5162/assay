name: ci

on:
  push:
    branches: [main, refactor/rust]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust · fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy（零容忍）
        run: cargo clippy -p dataproof-core -p dataproof --all-targets -- -D warnings

      - name: Test
        run: cargo test -p dataproof-core -p dataproof

      - name: Build release
        run: cargo build --release --locked -p dataproof

  wasm:
    name: wasm · Leptos 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # 用预编译包：cargo install trunk 在 CI 里要编译几分钟
      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz
          sudo mv trunk /usr/local/bin/
          trunk --version

      - name: Clippy（wasm 目标，零容忍）
        run: cargo clippy -p dataproof-web --target wasm32-unknown-unknown -- -D warnings

      - name: Build dist
        working-directory: crates/web
        run: trunk build --release

      - name: 产物自检
        run: |
          test -f crates/web/dist/index.html
          test -f crates/web/dist/data.json
          test -f crates/web/dist/TopProofs.lean
          ls -lh crates/web/dist | head

  lean:
    name: lean · 证明内核校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 缓存 elan 工具链
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: 安装 elan（工具链由 lean-toolchain 指定）
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: 内核校验（拒绝 sorry / admit）
        run: cargo run --release -p dataproof -- check-proofs fixtures/expected.lean

  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 不用 gitleaks-action：它按 push 事件算 bb83aac^..HEAD，而 bb83aac 是根提交，
      # 没有父提交 → "ambiguous argument" → 报 exit 1（明明没扫到任何东西）。
      # 直接调 CLI，扫全部分支历史。
      - name: 扫描历史
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact -v --exit-code=1 --log-opts="--all"
