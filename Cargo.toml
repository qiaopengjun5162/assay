[workspace]
members = ["crates/core", "crates/cli", "crates/web"]
resolver = "2"
# 旧的原型包，重构完成前保留，避免 Cargo 把它当成员
exclude = ["rust-core"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/qiaopengjun5162/dataproof"
authors = ["Paxon Qiao <qiaopengjun0@gmail.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "fat"
